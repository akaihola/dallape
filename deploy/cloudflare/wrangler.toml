# Worker in front of dallape.vempai.men: shows a "Starting up…" page while
# the sleeping Scaleway container wakes. See docs/tasks/1-scaleway-deployment.md.
# The /api/* "no Worker" route lives outside this file (Cloudflare API).
name = "dallape-front"
main = "worker.js"
compatibility_date = "2026-09-26"
workers_dev = false
routes = [{ pattern = "dallape.vempai.men/*", zone_name = "vempai.men" }]
